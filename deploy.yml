name: Multi-Branch Deploy to GitHub Pages

on:
  push:
    branches:
      - gh-pages
      - develop
      - feature/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Base Path
        id: path
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/gh-pages" ]]; then
            echo "base_path=/" >> $GITHUB_OUTPUT
            echo "deployment_name=Production (Root)" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "base_path=/develop" >> $GITHUB_OUTPUT
            echo "deployment_name=Develop Branch" >> $GITHUB_OUTPUT
          else
            # Extract feature branch name for path
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/feature/||')
            SAFE_NAME=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            echo "base_path=/feature/$SAFE_NAME" >> $GITHUB_OUTPUT
            echo "deployment_name=Feature: $BRANCH_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Update Base Path in HTML
        run: |
          BASE_PATH="${{ steps.path.outputs.base_path }}"
          # Update base tag in index.html if it exists, or add it
          if grep -q '<base ' index.html; then
            sed -i "s|<base [^>]*>|<base href=\"$BASE_PATH/\">|" index.html
          else
            sed -i "0,/<head>/s//<base href=\"$BASE_PATH\/\">\n<head>/" index.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
