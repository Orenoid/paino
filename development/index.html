<!DOCTYPE html>
<html>
<head lang="zh">
    <meta charset="UTF-8">
    <title>五线谱记忆小工具</title>
    <meta name="viewport" content="width=device-width,user-scalable=no">
    <style>

        body{
            margin: 0;
            font-family: "Helvetica","Microsoft YaHei";
            font-size: 15px;
            -webkit-user-select:none;
            cursor: default;
        }

        @media all and (min-width:400px) {
            .container{
                left:50%;
                margin-left:-200px;
            }
        }

        .container{
            max-width: 400px;
            max-height: 600px;
            width: 100%;
            position: absolute;
            top:0;
            bottom: 0;
            text-align: center;
        }

        #toolbox{
            text-align: center;
            margin: 0 auto;
        }
        button{
            width: 120px;
            line-height: 35px;
            border:1px solid #bfbfbf;
            border-radius: 5px;
            color: #646464;
            background-color: #fff;
            margin: 10px 5px;
            display: inline-block;
            vertical-align: middle;
        }

        .toggle-container, .select-container {
            display: inline-block;
            margin: 10px 5px;
            vertical-align: middle;
        }

        .toggle-container span, .select-container span {
            vertical-align: middle;
        }

        .switch {
          position: relative;
          display: inline-block;
          width: 40px; /* 控制开关宽度 */
          height: 22px; /* 控制开关高度 */
          vertical-align: middle;
        }

        .switch input {
          opacity: 0;
          width: 0;
          height: 0;
        }

        .slider {
          position: absolute;
          cursor: pointer;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background-color: #ccc;
          -webkit-transition: .4s;
          transition: .4s;
        }

        .slider:before {
          position: absolute;
          content: "";
          height: 16px; /* 控制滑块高度 */
          width: 16px; /* 控制滑块宽度 */
          left: 3px;
          bottom: 3px;
          background-color: white;
          -webkit-transition: .4s;
          transition: .4s;
        }

        input:checked + .slider {
          background-color: #000000;
        }

        input:focus + .slider {
          box-shadow: 0 0 1px #646464;
        }

        input:checked + .slider:before {
          -webkit-transform: translateX(18px); /* 控制滑块移动距离 */
          -ms-transform: translateX(18px);
          transform: translateX(18px);
        }

        /* Rounded sliders */
        .slider.round {
          border-radius: 22px; /* 控制开关圆角 */
        }

        .slider.round:before {
          border-radius: 50%;
        }

        #range {
            width:30px;
            border:1px solid #bfbfbf;
        }

        #tips{
            position: relative;
            width:100%;
            height:12px;
            /*margin: 20%;*/
        }
        #right,#wrong{
            position: absolute;
            width:15px;
            top:10px;
            left:45%;
        }
        .hidden{
            opacity: 0;
        }
        .easeout{
            -webkit-animation:easeout 2.75s;
            -webkit-animation-fill-mode:forwards;
        }
        @-webkit-keyframes easeout{
            0% {opacity: 1;}
            100% {opacity: 0;}
        }
        #answer{
            position: absolute;
            left:55%;
            top:9px;
        }
        #showArea{
            position: relative;
        }
        #stave{
            max-width: 60%;
            width: auto;
            margin: 0 20% 0;
        }
        #note{
            width:4.4%;
            position: absolute;
            left:58%;
            -webkit-transition:0.2s;
        }
        #paino{
            position: relative;
            border-top: 1px solid gray;
            width:100%;
            height: 150px;
            overflow: hidden;
            display: none; /* 默认隐藏，在弹出框中显示 */
        }
        .keyDown{
            width:13.16%;
            background-color: #fff;
            border-radius: 5px;
            border: 1px solid black;
            position: absolute;
            bottom:0;
            height:300px;
            text-align: center;

        }
        .keyUp{
            width:10%;
            background-color: #000;
            border-radius: 5px;
            position: absolute;
            bottom: 45%;
            height: 300px;
        }
        .keyC{
            left:0;
        }
        .keyD{
            left:14%;
        }
        .keyE{
            left:28%;
        }
        .keyF{
            left:42%;
        }
        .keyG{
            left:56%;
        }
        .keyA{
            left:70%;
        }
        .keyB{
            left:84%;
            right:0;
            width:auto;
        }

        .keyUpC{
            left:9%;
        }
        .keyUpD{
            left:22.8%;
        }
        .keyUpF{
            left:50.5%;
        }
        .keyUpG{
            left:64.7%;
        }
        .keyUpA{
            left:79%;
        }
        .keyDownName{
            position: absolute;
            bottom: 5px;
            width: 100%;
            left: 0;
            text-align: center;
        }

        .keySolfegeName{
            position: absolute;
            bottom: 30px;
            width: 100%;
            left: 0;
            text-align: center;
        }

        .Up3D{top:   7%  }
        .Up3C{top:   9.083%  }
        .Up3B{top:   11.166%  }
        .Up3A{top:   13.249%  }
        .Up2G{top:   15.333%  }
        .Up2F{top:   17.417%  }
        .Up2E{top:   19.5%  }
        .Up2D{top:   21.583%  }
        .Up2C{top:   23.667%  }
        .Up2B{top:   25.75%  }
        .Up2A{top:   27.833%  }
        .Up1G{top:   29.917%  }
        .Up1F{top:   32%  }
        .Up1E{top:   34.083%  }
        .Up1D{top:   36.167%  }
        .Up1C{top:   38.25%  }
        .Up1B{top:   40.333%  }
        .Up1A{top:   42.417%  }
        .Up0G{top:   44.5%  }

        .Down3F{top:   48.7%  }

        .Down3D{top:   52.887%  }

        .Down3B{top:   57.073%  }
        .Down3A{top:   59.166%  }
        .Down2G{top:   61.259%  }
        .Down2F{top:   63.353%  }
        .Down2E{top:   65.447%  }
        .Down2D{top:   67.54%  }
        .Down2C{top:   69.633%  }
        .Down2B{top:   71.727%  }
        .Down2A{top:   73.82%  }
        .Down1G{top:   75.913%  }
        .Down1F{top:   78.007%  }
        .Down1E{top:   80.1%  }
        .Down1D{top:   82.193%  }

        /* 大键盘样式 - 88键 SVG */
        #full-piano {
            position: relative;
            width: 100%;
            height: auto;
            margin-top: 10px;
            border-top: 1px solid gray;
        }

        #full-piano img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 可点击组区域 */
        .octave-group {
            position: absolute;
            top: 0;
            height: 100%;
            cursor: pointer;
            z-index: 10;
        }

        .octave-group:hover {
            background-color: rgba(200, 200, 200, 0.2);
        }

        /* 组遮罩 - 统一样式，不同颜色 */
        .group-mask {
            position: absolute;
            top: 0;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* 灰色遮罩 - 正确组选中 */
        .mask-gray {
            background-color: rgba(128, 128, 128, 0.4);
        }

        /* 浅红色遮罩 - 错误提示 */
        .mask-red {
            background-color: rgba(255, 100, 100, 0.4);
            animation: flash-twice 0.5s ease-in-out;
        }

        @keyframes flash-twice {
            0%, 100% { opacity: 0; }
            25% { opacity: 1; }
            50% { opacity: 0; }
            75% { opacity: 1; }
        }

        /* 浅黄色遮罩 - 警告提示 */
        .mask-yellow {
            background-color: rgba(255, 255, 100, 0.4);
        }

        /* 大键盘整体遮罩 */
        .full-piano-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 8;
        }

        /* 大键盘下方的提示区域 */
        #full-piano + #tips {
            margin-top: 8px;
            height: 25px;
        }

        /* 各组位置 - 基于52个白键均分100%宽度 */
        /* A0-B0: 2个白键 */
        .group-0 { left: 0%; width: 3.846%; }
        /* C1-B1: 7个白键 */
        .group-1 { left: 3.846%; width: 13.461%; }
        /* C2-B2: 7个白键 */
        .group-2 { left: 17.307%; width: 13.461%; }
        /* C3-B3: 7个白键 */
        .group-3 { left: 30.768%; width: 13.461%; }
        /* C4-B4: 7个白键 (中央C) */
        .group-4 { left: 44.229%; width: 13.461%; }
        /* C5-B5: 7个白键 */
        .group-5 { left: 57.69%; width: 13.461%; }
        /* C6-B6: 7个白键 */
        .group-6 { left: 71.151%; width: 13.461%; }
        /* C7-B7: 7个白键 */
        .group-7 { left: 84.612%; width: 13.461%; }
        /* C8: 1个白键 */
        .group-8 { left: 98.073%; width: 1.927%; }

        /* 弹出框样式 - 放大镜效果 */
        #piano-popup {
            position: absolute;
            background: white;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100;
            display: none;
            width: 280px;
            height: 100px;
        }

        /* 小三角 */
        #piano-popup::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 12px solid #333;
        }

        /* 小三角内部白色（与弹出框背景一致） */
        #piano-popup::before {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid white;
            z-index: 101;
        }

        /* 弹出框内的小键盘样式 */
        #popup-piano {
            position: relative;
            width: 100%;
            height: 80px;
            overflow: hidden;
        }

        #popup-piano .keyDown {
            height: 100%;
        }

        #popup-piano .keyUp {
            height: 50%;
            bottom: 50%;
        }

        #popup-piano .keyDownName {
            font-size: 14px;
            bottom: 5px;
        }

        #popup-piano .keySolfegeName {
            font-size: 12px;
            bottom: 25px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div id="toolbalr">

<script>
    var notesUp = ["Up3D","Up3C","Up3B","Up3A","Up2G","Up2F","Up2E","Up2D","Up2C","Up2B","Up2A","Up1G","Up1F","Up1E","Up1D","Up1C","Up1B","Up1A","Up0G"];
    var notesDown = ["Down3F","Down3E","Down3D","Down3C","Down3B","Down3A","Down2G","Down2F","Down2E","Down2D","Down2C","Down2B","Down2A","Down1G","Down1F","Down1E","Down1D","Down1C","Down1B"];
    var changeShow = document.getElementById("changeShow");
    var changeMode = document.getElementById("changeMode");
    var note = document.getElementById("note");
    var keyNames = document.querySelectorAll(".keyDownName, .keySolfegeName");
    var painoDown = document.getElementById("normal");
    var popupPiano = document.getElementById("popup-normal");
    var pianoPopup = document.getElementById("piano-popup");
    var fullPiano = document.getElementById("full-piano");
    var show = true;
    var mode = changeMode.value;
    var right = document.getElementById("right");
    var wrong = document.getElementById("wrong");
    var tips = document.getElementById("tips");
    var answer = document.getElementById("answer");
    //var range = document.getElementById("range");

    function randomizeNote() {
        var shangxian = 19;
        var xiaxian = 0;
        var seed = Math.floor(xiaxian + (Math.random() * (shangxian - xiaxian)));
        if (mode == "up") {
            note.className = notesUp[seed];
        } else if (mode == "down") {
            note.className = notesDown[seed];
        } else {
            if (Math.random() > 0.5) {
                note.className = notesUp[seed];
            } else {
                note.className = notesDown[seed];
            }
        }
    }

    var noteToSolfege = {
        'A': 'La',
        'B': 'Si',
        'C': 'Do',
        'D': 'Re',
        'E': 'Mi',
        'F': 'Fa',
        'G': 'Sol'
    };

    var fun1 = function (event) {
        event.preventDefault();
        this.style.backgroundColor="#EAEAEA";
    };
    changeShow.addEventListener("touchstart", fun1);
    changeShow.addEventListener("mousedown", fun1);

    changeShow.addEventListener("change", function(event) {
        var display = this.checked ? "" : "none";
        for(var i=keyNames.length-1; i>=0; i--){
            keyNames[i].style.display = display;
        }
        show = this.checked;
    });


    changeMode.addEventListener("change", function(event) {
        mode = this.value;
        initNewQuestion();
    });


    var fun5 = function (event) {
        event.preventDefault();
        var target = event.target;
        if(target.nodeName==="SPAN"){
            target = target.parentNode;
        }
        if(target.className.search("pressUp")!==-1){
            target.className=target.className.replace("pressUp","pressDown");
        }else{
            target.className+=" pressDown";
        }
    };
    painoDown.addEventListener("touchstart", fun5);
    painoDown.addEventListener("mousedown", fun5);


    // ========== 状态机实现 ==========
    var State = {
        IDLE: 'IDLE',              // 初始状态，等待选组
        GROUP_SELECTED: 'GROUP_SELECTED',  // 已选组，等待选琴键
        ANSWERING: 'ANSWERING'     // 答题中（防止重复触发）
    };

    var gameState = {
        status: State.IDLE,
        selectedGroup: null,
        correctGroup: null
    };

    var maskContainer = document.getElementById('mask-container');

    // 组位置配置
    var groupPositions = [
        { left: '0%', width: '3.846%' },      // 0: A0-B0
        { left: '3.846%', width: '13.461%' }, // 1: C1-B1
        { left: '17.307%', width: '13.461%' },// 2: C2-B2
        { left: '30.768%', width: '13.461%' },// 3: C3-B3
        { left: '44.229%', width: '13.461%' },// 4: C4-B4
        { left: '57.69%', width: '13.461%' }, // 5: C5-B5
        { left: '71.151%', width: '13.461%' },// 6: C6-B6
        { left: '84.612%', width: '13.461%' },// 7: C7-B7
        { left: '98.073%', width: '1.927%' }  // 8: C8
    ];

    // 音符到钢琴音组的映射
    // 基于实际五线谱位置验证后的映射
    // 高音谱表: 下加三间(G3) -> 上加三间(D6)，共19个音
    // 低音谱表: 下加三间(B1) -> 上加三间(F4)，共19个音
    function getNoteGroup(noteClass) {
        var noteGroups = {
            // ===== 高音谱表 (Up) =====
            // Group 6: C6, D6
            'Up3D': 6, 'Up3C': 6,
            // Group 5: C5, D5, E5, F5, G5, A5, B5
            'Up3B': 5, 'Up3A': 5, 'Up2G': 5, 'Up2F': 5, 'Up2E': 5, 'Up2D': 5, 'Up2C': 5,
            // Group 4: C4, D4, E4, F4, G4, A4, B4 (中央C组)
            'Up2B': 4, 'Up2A': 4, 'Up1G': 4, 'Up1F': 4, 'Up1E': 4, 'Up1D': 4, 'Up1C': 4,
            // Group 3: A3, B3, C3, D3, E3, F3, G3
            'Up1B': 3, 'Up1A': 3, 'Up0G': 3,

            // ===== 低音谱表 (Down) =====
            // Group 4: C4, D4, E4, F4 (中央C组)
            'Down3F': 4, 'Down3E': 4, 'Down3D': 4, 'Down3C': 4,
            // Group 3: A3, B3, C3, D3, E3, F3, G3
            'Down3B': 3, 'Down3A': 3, 'Down2G': 3, 'Down2F': 3, 'Down2E': 3, 'Down2D': 3, 'Down2C': 3,
            // Group 2: C2, D2, E2, F2, G2, A2, B2
            'Down2B': 2, 'Down2A': 2, 'Down1G': 2, 'Down1F': 2, 'Down1E': 2, 'Down1D': 2, 'Down1C': 2,
            // Group 1: B1 (低音谱表最低音)
            'Down1B': 1
        };
        return noteGroups[noteClass] !== undefined ? noteGroups[noteClass] : 4;
    }

    // 工具函数
    function createMask(groupIndex, colorClass) {
        var mask = document.createElement('div');
        mask.className = 'group-mask ' + colorClass;
        mask.style.left = groupPositions[groupIndex].left;
        mask.style.width = groupPositions[groupIndex].width;
        return mask;
    }

    function createFullPianoMask() {
        var mask = document.createElement('div');
        mask.className = 'full-piano-mask mask-yellow';
        return mask;
    }

    function clearMasks() {
        maskContainer.innerHTML = '';
    }

    // 显示弹出框在指定音组上方
    function showPopup(groupIndex) {
        var groupPos = groupPositions[groupIndex];
        var fullPianoRect = fullPiano.getBoundingClientRect();
        var containerRect = document.querySelector('.container').getBoundingClientRect();

        // 计算音组中心位置（相对于容器）
        var groupLeftPercent = parseFloat(groupPos.left);
        var groupWidthPercent = parseFloat(groupPos.width);
        var groupCenterPercent = groupLeftPercent + groupWidthPercent / 2;

        // 弹出框宽度固定为280px，计算位置使其居中于音组
        var popupWidth = 280;
        var containerWidth = containerRect.width;
        var centerX = (groupCenterPercent / 100) * containerWidth;
        var popupLeft = centerX - popupWidth / 2;

        // 边界检查：确保弹出框不超出容器
        if (popupLeft < 10) popupLeft = 10;
        if (popupLeft + popupWidth > containerWidth - 10) {
            popupLeft = containerWidth - popupWidth - 10;
        }

        // 设置弹出框位置（在大键盘上方）
        pianoPopup.style.left = popupLeft + 'px';
        pianoPopup.style.bottom = (fullPianoRect.height + 10) + 'px';
        pianoPopup.style.display = 'block';
    }

    // 隐藏弹出框
    function hidePopup() {
        pianoPopup.style.display = 'none';
    }

    function showMessage(message, type) {
        wrong.style.display = type === 'wrong' ? '' : 'none';
        right.style.display = type === 'right' ? '' : 'none';
        tips.className = '';
        answer.innerHTML = message;
        setTimeout(function() {
            tips.className = 'easeout';
        }, 10);
    }

    // 重置游戏状态（用于下一题）
    function resetGame() {
        gameState.status = State.IDLE;
        gameState.selectedGroup = null;
        gameState.correctGroup = null;
        clearMasks();
        hidePopup();
    }

    // 初始化新题目
    function initNewQuestion() {
        randomizeNote();
        var correctGroup = getNoteGroup(note.className);
        gameState.correctGroup = correctGroup;
        gameState.status = State.IDLE;
        gameState.selectedGroup = null;
        clearMasks();
        console.log('New question:', note.className, 'Group:', correctGroup);
    }

    // 大键盘组点击处理
    var octaveGroups = document.querySelectorAll('.octave-group');
    octaveGroups.forEach(function(group) {
        group.addEventListener('click', function() {
            var groupNum = parseInt(this.getAttribute('data-group'));
            console.log('Group clicked:', groupNum, 'Current state:', gameState.status, 'Correct group:', gameState.correctGroup);

            if (gameState.status === State.IDLE) {
                if (groupNum === gameState.correctGroup) {
                    // IDLE → GROUP_SELECTED: 选择正确组
                    console.log('Correct group selected!');
                    gameState.status = State.GROUP_SELECTED;
                    gameState.selectedGroup = groupNum;
                    maskContainer.appendChild(createMask(groupNum, 'mask-gray'));
                    // 显示弹出框
                    showPopup(groupNum);
                } else {
                    // IDLE → IDLE: 选择错误组，显示红色提示
                    console.log('Wrong group, showing red mask on correct group:', gameState.correctGroup);
                    var correctMask = createMask(gameState.correctGroup, 'mask-red');
                    maskContainer.appendChild(correctMask);
                    setTimeout(function() {
                        if (correctMask.parentNode === maskContainer) {
                            maskContainer.removeChild(correctMask);
                        }
                    }, 1000);
                }
            }
            // GROUP_SELECTED 状态下点击其他组：忽略，但允许点击当前选中组来关闭弹出框
            else if (gameState.status === State.GROUP_SELECTED) {
                if (groupNum === gameState.selectedGroup) {
                    // 再次点击已选中的组，关闭弹出框
                    hidePopup();
                    gameState.status = State.IDLE;
                    gameState.selectedGroup = null;
                    clearMasks();
                }
            }
        });
    });

    // 小键盘点击处理（弹出框内）
    var fun6 = function(event) {
        event.preventDefault();

        if (gameState.status === State.ANSWERING) {
            return; // 防止重复点击
        }

        var target = event.target;
        var key = note.className.slice(-1);
        if (target.nodeName === "SPAN") {
            target = target.parentNode;
        }
        target.className = target.className.replace("pressDown", "pressUp");

        if (gameState.status === State.IDLE) {
            // 未选组直接点小键盘 - 现在这种情况不会发生，因为弹出框未显示
            return;
        }

        if (gameState.status === State.GROUP_SELECTED) {
            gameState.status = State.ANSWERING;
            var clickedKey = target.className.split(/[^^]key/)[1][0];

            if (clickedKey === key) {
                // 答对：显示正确，关闭弹出框，然后下一题
                showMessage(key + "/" + noteToSolfege[key], 'right');
                hidePopup();
                setTimeout(function() {
                    initNewQuestion();
                }, 250); // 缩短到250ms
            } else {
                // 答错：显示错误，保持当前状态等待再次尝试
                showMessage(key + "/" + noteToSolfege[key], 'wrong');
                gameState.status = State.GROUP_SELECTED; // 恢复状态，允许再次尝试
            }
        }
    };

    // 绑定弹出框内小键盘的事件
    popupPiano.addEventListener("touchend", fun6);
    popupPiano.addEventListener("mouseup", fun6);
    // 保留原小键盘事件（以防需要恢复）
    painoDown.addEventListener("touchend", fun5);
    painoDown.addEventListener("mouseup", fun5);

    // 初始化第一题
    initNewQuestion();
</script>
</html>
