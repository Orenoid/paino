        @media all and (min-width:400px) {

        .container{
            max-width: 400px;
            max-height: 600px;
            width: 100%;
            position: absolute;
            top:0;
            bottom: 0;
            text-align: center;
        }

        #toolbox{
            text-align: center;
            margin: 0 auto;
        }
        button{
            width: 120px;
            line-height: 35px;
            border:1px solid #bfbfbf;
            border-radius: 5px;
            color: #646464;
            background-color: #fff;
            margin: 10px 5px;
            display: inline-block;
            vertical-align: middle;
        }

        .toggle-container, .select-container {
            display: inline-block;
            margin: 10px 5px;
            vertical-align: middle;
        }

        .toggle-container span, .select-container span {
            vertical-align: middle;
        }

        .switch {
          position: relative;
          display: inline-block;
          width: 40px; /* 控制开关宽度 */
          height: 22px; /* 控制开关高度 */
          vertical-align: middle;
        }

        .switch input {
          opacity: 0;
          width: 0;
          height: 0;
        }

        .slider {
          position: absolute;
          cursor: pointer;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background-color: #ccc;
          -webkit-transition: .4s;
          transition: .4s;
        }

        .slider:before {
          position: absolute;
          content: "";
          height: 16px; /* 控制滑块高度 */
          width: 16px; /* 控制滑块宽度 */
          left: 3px;
          bottom: 3px;
          background-color: white;
          -webkit-transition: .4s;
          transition: .4s;
        }

        input:checked + .slider {
          background-color: #000000;
        }

        input:focus + .slider {
          box-shadow: 0 0 1px #646464;
        }

        input:checked + .slider:before {
          -webkit-transform: translateX(18px); /* 控制滑块移动距离 */
          -ms-transform: translateX(18px);
          transform: translateX(18px);
        }

        /* Rounded sliders */
        .slider.round {
          border-radius: 22px; /* 控制开关圆角 */
        }

        .slider.round:before {
          border-radius: 50%;
        }

        #range {
            width:30px;
            border:1px solid #bfbfbf;
        }

        #tips{
            position: relative;
            width:100%;
            height:12px;
            /*margin: 20%;*/
        }
        #right,#wrong{
            position: absolute;
            width:15px;
            top:10px;
            left:45%;
        }
        .hidden{
            opacity: 0;
        }
        .easeout{
            -webkit-animation:easeout 2.75s;
            -webkit-animation-fill-mode:forwards;
        }
        @-webkit-keyframes easeout{
            0% {opacity: 1;}
            100% {opacity: 0;}
        }
        #answer{
            position: absolute;
            left:55%;
            top:9px;
        }
        #showArea{

        }

            </div>

        </div>

            <img id="note" src="../note.gif" alt="note" class=""/>
        </div>
        <div id="paino">

                <div class="keyDown keyC"><span class="keySolfegeName">Do</span><span class="keyDownName">C</span></div>

                <div class="keyUp keyUpF"><span class="keyUpName"></span></div>
                <div class="keyUp keyUpG"><span class="keyUpName"></span></div>

            </div>
        </div>

            <img src="../piano-88-keys.svg" alt="88键钢琴键盘" id="piano-img">
            <!-- 遮罩层容器 -->

        </div>
        <!-- 放大镜 -->
        <div id="magnifier">
            <div id="magnifier-center"></div>
        </div>

            <span id="answer">C</span>

        var shangxian = 19;

        var seed = Math.floor(xiaxian + (Math.random() * (shangxian - xiaxian)));
        if (mode == "up") {
            note.className = notesUp[seed];

            note.className = notesDown[seed];

            if (Math.random() > 0.5) {

        { note: 'C8', type: 'white', left: 98.076, width: 1.923 }
    ];

    // 音符类名到琴键名的映射
    var noteToKey = {
        'Up3D': 'D6', 'Up3C': 'C6', 'Up3B': 'B5', 'Up3A': 'A5', 'Up2G': 'G5', 'Up2F': 'F5', 'Up2E': 'E5', 'Up2D': 'D5', 'Up2C': 'C5',
        'Up2B': 'B4', 'Up2A': 'A4', 'Up1G': 'G4', 'Up1F': 'F4', 'Up1E': 'E4', 'Up1D': 'D4', 'Up1C': 'C4', 'Up1B': 'B3', 'Up1A': 'A3', 'Up0G': 'G3',
        'Down3F': 'F4', 'Down3E': 'E4', 'Down3D': 'D4', 'Down3C': 'C4', 'Down3B': 'B3', 'Down3A': 'A3', 'Down2G': 'G3', 'Down2F': 'F3', 'Down2E': 'E3', 'Down2D': 'D3', 'Down2C': 'C3',
        'Down2B': 'B2', 'Down2A': 'A2', 'Down1G': 'G2', 'Down1F': 'F2', 'Down1E': 'E2', 'Down1D': 'D2', 'Down1C': 'C2', 'Down1B': 'B1'
    };

    // 根据位置获取对应的琴键
    function getKeyAtPosition(percentX) {
        // 先检查黑键（黑键在白键之上）
        for (var i = 0; i < pianoKeys.length; i++) {
            if (pianoKeys[i].type === 'black') {
                if (percentX >= pianoKeys[i].left && percentX <= pianoKeys[i].left + pianoKeys[i].width) {
                    return pianoKeys[i];
                }
            }
        }
        // 再检查白键
        for (var j = 0; j < pianoKeys.length; j++) {
            if (pianoKeys[j].type === 'white') {
                if (percentX >= pianoKeys[j].left && percentX <= pianoKeys[j].left + pianoKeys[j].width) {
                    return pianoKeys[j];
                }
            }
        }
        return null;
    }

    // 显示放大镜
    function showMagnifier(x, y) {
        var containerRect = document.querySelector('.container').getBoundingClientRect();
        var fullPianoRect = fullPiano.getBoundingClientRect();
        var magnifierSize = 150;

        // 水平方向：跟随手指，但保持在容器内
        var magnifierX = x - magnifierSize / 2;

        // 边界检查（水平方向）
        if (magnifierX < 0) magnifierX = 10;
        if (magnifierX + magnifierSize > containerRect.width) {
            magnifierX = containerRect.width - magnifierSize - 10;
        }

        // 垂直方向：固定在键盘上方（可配置的偏移量）
        var magnifierY = fullPianoRect.top - containerRect.top - magnifierSize + magnifierVerticalOffset;

        magnifier.style.left = magnifierX + 'px';
        magnifier.style.top = magnifierY + 'px';
        magnifier.style.display = 'block';
        isMagnifierVisible = true;

        // 更新放大镜内容位置
        updateMagnifierContent(x);
    }

    // 更新放大镜内容（使用 background-position 实现放大效果）
    function updateMagnifierContent(touchX) {
        var fullPianoRect = fullPiano.getBoundingClientRect();

        // 计算触摸位置相对于钢琴图片的百分比 (0-1)，并限制在有效范围内
        var rawPercentX = ((touchX - fullPianoRect.left) / fullPianoRect.width);
        var pianoPercentX = Math.max(0, Math.min(1, rawPercentX));

        // 当 background-size: 400% 时，图片宽度是容器的4倍
        // 这意味着我们只能看到图片的 1/4 宽度
        // 为了让放大镜中心对准触摸位置，需要计算正确的 background-position
        //
        // 推导：
        // - 触摸位置 0%（最左）时，放大镜中心应该对准图片的 12.5%（因为 1/4 宽度的一半是 1/8 = 12.5%）
        // - 触摸位置 50%（中间）时，放大镜中心对准图片的 50%
        // - 触摸位置 100%（最右）时，放大镜中心对准图片的 87.5%
        //
        // 公式：bgPos = 12.5% + pianoPercentX * 75%
        // 即：bgPos = (1/8) + pianoPercentX * (3/4)
        // 转换为百分比：bgPos = 12.5 + pianoPercentX * 75

        var bgPosX = 12.5 + pianoPercentX * 75;
        var bgPosY = 50; // 垂直方向固定显示中间

        magnifier.style.backgroundPosition = bgPosX + '% ' + bgPosY + '%';
    }

    // 隐藏放大镜
    function hideMagnifier() {
        magnifier.style.display = 'none';
        isMagnifierVisible = false;
        if (selectedKeyElement) {
            selectedKeyElement.remove();
            selectedKeyElement = null;
        }
    }

    // 高亮选中的琴键
    function highlightKey(key) {
        if (selectedKeyElement) {
            selectedKeyElement.remove();
        }

        var fullPianoRect = fullPiano.getBoundingClientRect();
        var highlight = document.createElement('div');
        highlight.className = 'key-highlight-mask';
        highlight.style.left = key.left + '%';
        highlight.style.width = key.width + '%';
        highlight.style.top = '0';
        highlight.style.height = key.type === 'black' ? '60%' : '100%';

        maskContainer.appendChild(highlight);
        selectedKeyElement = highlight;
    }

    // 显示选中琴键的音符名
    function showKeyLabel(key) {
        // 可以在放大镜中心显示当前选中的音符名
        // 这里简化处理，只高亮显示
    }

    function showMessage(message, type) {
        wrong.style.display = type === 'wrong' ? '' : 'none';
        right.style.display = type === 'right' ? '' : 'none';
        tips.className = '';
        answer.innerHTML = message;
        setTimeout(function() {
            tips.className = 'easeout';
        }, 10);
    }

    // 清除所有遮罩
    function clearMasks() {
        maskContainer.innerHTML = '';
        selectedKeyElement = null;
    }

    // 初始化新题目
    function initNewQuestion() {
        randomizeNote();
        clearMasks();
        console.log('New question:', note.className, 'Key:', noteToKey[note.className]);
    }

    // 处理触摸/鼠标开始
    function handleStart(event) {
        // 防止浏览器默认行为（如下载图片菜单）
        event.preventDefault();
        event.stopPropagation();

        var touch = event.touches ? event.touches[0] : event;
        var fullPianoRect = fullPiano.getBoundingClientRect();

        // 检查是否在扩展的触发区域内（键盘上下各扩展50px）
        var triggerTop = fullPianoRect.top - triggerAreaPadding;
        var triggerBottom = fullPianoRect.bottom + triggerAreaPadding;

        if (touch.clientY < triggerTop || touch.clientY > triggerBottom) {
            return;
        }

        currentTouchPos.x = touch.clientX;
        currentTouchPos.y = touch.clientY;
        isLongPress = false;

        // 开始长按计时
        longPressTimer = setTimeout(function() {
            isLongPress = true;
            showMagnifier(currentTouchPos.x, currentTouchPos.y);
        }, 300); // 300ms触发长按
    }

    // 处理触摸/鼠标移动
    function handleMove(event) {
        // 防止浏览器默认行为
        event.preventDefault();
        event.stopPropagation();

        var touch = event.touches ? event.touches[0] : event;

        // 如果还没触发长按，检查移动距离是否超过阈值
        if (!isLongPress) {
            var moveDistance = Math.abs(touch.clientX - currentTouchPos.x) +
                               Math.abs(touch.clientY - currentTouchPos.y);
            // 如果移动超过10px，取消长按
            if (moveDistance > 10) {
                clearTimeout(longPressTimer);
            }
            return;
        }

        currentTouchPos.x = touch.clientX;
        currentTouchPos.y = touch.clientY;

        // 更新放大镜位置和内容（只在水平方向跟随）
        if (isMagnifierVisible) {
            showMagnifier(currentTouchPos.x, currentTouchPos.y);

            // 高亮当前选中的琴键
            var fullPianoRect = fullPiano.getBoundingClientRect();
            var percentX = ((currentTouchPos.x - fullPianoRect.left) / fullPianoRect.width) * 100;
            var key = getKeyAtPosition(percentX);
            if (key) {
                highlightKey(key);
            }
        }
    }

    // 处理触摸/鼠标结束
    function handleEnd(event) {
        clearTimeout(longPressTimer);

        if (isLongPress && isMagnifierVisible) {
            // 长按结束，检查选中的琴键
            var fullPianoRect = fullPiano.getBoundingClientRect();
            var percentX = ((currentTouchPos.x - fullPianoRect.left) / fullPianoRect.width) * 100;
            var key = getKeyAtPosition(percentX);

            if (key) {
                // 检查答案
                var targetKey = noteToKey[note.className];
                var targetNote = targetKey.replace(/\d/, ''); // 提取音符名（去掉数字）
                var clickedNote = key.note.replace(/\d/, '');

                if (clickedNote === targetNote && key.note === targetKey) {
                    // 答对
                    showMessage(clickedNote + '/' + noteToSolfege[clickedNote], 'right');
                    hideMagnifier();
                    setTimeout(function() {
                        initNewQuestion();
                    }, 250);
                } else {
                    // 答错
                    showMessage(targetNote + '/' + noteToSolfege[targetNote], 'wrong');
                    hideMagnifier();
                }
            } else {
                hideMagnifier();
            }
        }

        isLongPress = false;
    }

    // 绑定大键盘事件
    fullPiano.addEventListener('touchstart', handleStart, { passive: false });
    fullPiano.addEventListener('touchmove', handleMove, { passive: false });
    fullPiano.addEventListener('touchend', handleEnd);
    fullPiano.addEventListener('touchcancel', handleEnd);
    fullPiano.addEventListener('mousedown', handleStart);
    fullPiano.addEventListener('mousemove', handleMove);
    fullPiano.addEventListener('mouseup', handleEnd);
    fullPiano.addEventListener('mouseleave', handleEnd);

    // 禁用大键盘图片的默认拖拽和右键菜单行为
    pianoImg.addEventListener('dragstart', function(e) { e.preventDefault(); });
    pianoImg.addEventListener('contextmenu', function(e) { e.preventDefault(); });

    // 保留原小键盘事件（以防需要恢复）
    painoDown.addEventListener("touchend", fun5);
    painoDown.addEventListener("mouseup", fun5);

    // 初始化第一题
    initNewQuestion();
</script>
